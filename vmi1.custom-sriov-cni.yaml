---
apiVersion: kubevirt.io/v1alpha3
kind: VirtualMachineInstance
metadata:
  labels:
    special: testvmi3
  name: testvmi3
spec:
  domain:
    devices:
      disks:
      - disk:
          bus: virtio
        name: containerdisk
      interfaces:
      - masquerade: {}
        name: nic1
      - name: sriov-network
        sriov: {}
      rng: {}
    machine:
      type: q35
    resources:
      requests:
        memory: 1024M
  networks:
  - name: nic1
    pod: {}
  - name: sriov-network
    multus:
      networkName: sriov-network
  terminationGracePeriodSeconds: 0
  volumes:
  - name: containerdisk
    containerDisk:
      image: quay.io/omergi/fedora-sriov-lane:latest
      imagePullPolicy: Always
